name: Create file report

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate report/dateinamen.txt
        run: |
          python - << 'EOF'
          from pathlib import Path

          source_folder = Path("Testproject")
          report_folder = Path("report")
          output_file = report_folder / "dateinamen.txt"

          report_folder.mkdir(parents=True, exist_ok=True)

          with output_file.open("w", encoding="utf-8") as f:
              for file in source_folder.iterdir():
                  if file.is_file():
                      f.write(file.name + "\n")

          print("report/dateinamen.txt wurde erstellt")
          EOF

      - name: Commit report file to repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add report/dateinamen.txt
          git commit -m "Update report/dateinamen.txt" || echo "Nothing to commit"
          git push
