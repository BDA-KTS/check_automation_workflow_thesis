name: Create file report

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for missing Files
        shell: python
        run: |
          from pathlib import Path
          
          required_files=["LICENSE", "README.md", "CITATION.cff", "requirements.txt"]
          missing_files = []

          for name in required_files:
            path = repo_root / name
            if not path.exists() or not path.is_file():
              missing_files.append(name)

      - name: Generate report/dateinamen.txt
        shell: python
        run: |
          from pathlib import Path

          source_folder = Path("Testproject")
          report_folder = Path("report")
          output_file = report_folder / "dateinamen.txt"

          # Create report folder if it doesn't exist
          report_folder.mkdir(parents=True, exist_ok=True)

          # Write sorted filenames
          output_file.write_text(
            "\n".join(sorted(f.name for f in source_folder.iterdir() if f.is_file())),
            encoding="utf-8"
          )

          print(f"{output_file} wurde erstellt")

      - name: Commit report file to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add report/dateinamen.txt

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update report/dateinamen.txt"
            git push
          fi
