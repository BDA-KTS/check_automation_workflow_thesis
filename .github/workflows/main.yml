name: Create file report

permissions:
  contents: write

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate report/dateinamen.txt
        run: |
          python - << 'EOF'
          from pathlib import Path

          source_folder = Path("Testproject")
          report_folder = Path("report")
          output_file = report_folder / "dateinamen.txt"

          report_folder.mkdir(parents=True, exist_ok=True)

          with output_file.open("w", encoding="utf-8") as f:
              for file in sorted(source_folder.iterdir()):
                  if file.is_file():
                      f.write(file.name + "\n")

          print("report/dateinamen.txt wurde erstellt")
          EOF

      - name: Commit report file to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add report/dateinamen.txt

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update report/dateinamen.txt"
            git push
          fi
