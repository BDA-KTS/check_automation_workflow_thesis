name: List files from Testproject

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  list-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: List filenames and write to file
        run: |
          python - << 'EOF'
          from pathlib import Path

          folder = Path("Testproject")
          output_file = Path("dateinamen.txt")

          with output_file.open("w", encoding="utf-8") as f:
              for file in folder.iterdir():
                  if file.is_file():
                      f.write(file.name + "\n")

          print("dateinamen.txt wurde erstellt")
          EOF

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dateinamen
          path: dateinamen.txt
