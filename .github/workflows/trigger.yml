name: Trigger Central Workflow
permissions: write-all
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  trigger-other-repo-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Trigger workflow in another repository
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{secrets.mysecretkey}}" \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Content-Type: application/json" \
          https://api.github.com/repos/BDA-KTS/check_workflow_central_repo/dispatches \
          -d '{
            "event_type": "method",
            "client_payload": {
              "repository_url": "taimoorkhan-nlp/text_edit_distance_similarity",
              "repo_hash": "1ddf824b50bc6d159d1e1d6037d17419f32c2694",
              "readme": "README.md"
            }
          }'
