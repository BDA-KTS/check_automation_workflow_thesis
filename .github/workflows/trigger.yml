name: Trigger Central Workflow
permissions: write-all
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  trigger-other-repo-workflow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Trigger workflow in another repository
        run: |
          curl -X POST \
          -H "Authorization: Bearer ${{secrets.mysecretkey}}" \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Content-Type: application/json" \
          https://api.github.com/repos/BDA-KTS/check_workflow_central_repo/dispatches \
          -d '{
            "event_type": "report_creator",
            "client_payload": {
              "repository_full_name": "schochastics/paperwizard",
              "repo_hash": "e2315e76638fa10d22dcec418c8adba1f75766bf",
              "readme": "README.md"
            }
          }'
